name: Deploy to production

# Deploys html/ (and the project root, minus secrets and uploads) to the VPS
# over SSH whenever main is updated. A PHP syntax-check gate runs first, since
# the project has no automated tests — this is the last line of defence before
# code reaches production.

on:
  push:
    branches: [main]
    # Everything under scripts/ is laptop-side admin tooling — the Paintbrush
    # launcher and mac-match-prod.sh — and is excluded from the deploy rsync
    # below, so a change to it can never alter production. Without this, an
    # edit there fires a full deploy that re-mirrors identical files: noise
    # that makes the deploy log useless for spotting real ones. Note this
    # closes a gap — mac-match-prod.sh was unguarded and did fire one on
    # every edit.
    paths-ignore:
      - 'scripts/**'
  # Lets you trigger a deploy by hand from the Actions tab (useful for the
  # first run, or to re-deploy without a new commit).
  workflow_dispatch:

# Never let two deploys run at once; queue them instead of racing on the server.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  lint:
    name: PHP syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The runner's bundled PHP is whatever ubuntu-latest happens to ship, so
      # without this the last line of defence before production checks the code
      # against a different language version than the one that will run it.
      - name: Use the same PHP the server runs
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Lint every PHP file
        # `php -l` is a syntax check only — it won't catch logic bugs, but it
        # stops a stray typo from taking the whole site down.
        run: |
          find . -name '*.php' -not -path './ambOldSite/*' -print0 \
            | xargs -0 -n1 -P4 php -l

  database:
    name: Query check on MySQL 8.4
    runs-on: ubuntu-latest
    # `php -l` catches typos, not mistakes. This catches the other thing that
    # can reach production untested: SQL that works on a laptop's MySQL and
    # fails on the server's. Homebrew installs whatever MySQL is newest, which
    # is an Innovation release well ahead of the server's 8.4 LTS, and newer
    # versions add reserved words and change defaults. So the real tables are
    # created here on the real version and the site's own functions are called
    # against them -- see .github/ci/db-smoke.php.
    #
    # It holds no secrets, so the third-party action below cannot reach the
    # deploy key: secrets are scoped per job, and this job is given none.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: amb_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: Use the same PHP the server runs
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, gd, mbstring

      - name: Create the tables
        run: |
          mysql -h 127.0.0.1 -uroot -pci amb_ci < database/schema.sql
          mysql -h 127.0.0.1 -uroot -pci amb_ci < database/shop.sql
          mysql -h 127.0.0.1 -uroot -pci amb_ci < .github/ci/fixtures.sql

      - name: Run the site's own queries against it
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: amb_ci
          DB_USER: root
          DB_PASSWORD: ci
          APP_ENV: ci
        run: php .github/ci/db-smoke.php

  deploy:
    name: Rsync to server
    needs: [lint, database]   # deploy only runs if both gates passed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard against a missing deploy path
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -z "$DEPLOY_PATH" ]; then
            echo "::error::DEPLOY_PATH secret is empty — refusing to deploy (rsync --delete into the wrong dir is destructive)."
            exit 1
          fi

      - name: Set up the SSH deploy key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The server's host key. With the SSH_KNOWN_HOSTS secret set (the
          # output of `ssh-keyscan -p <port> <host>`, taken once from a trusted
          # machine) only that exact server is trusted. Without it the key is
          # fetched on every run, which trusts whatever answers that day.
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS secret not set; trusting the server key seen on this run."
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi

      - name: Deploy with rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='.idea/' \
            --exclude='ambOldSite/' \
            --exclude='/scripts/' \
            --exclude='CLAUDE.md' \
            --exclude='.env' \
            --exclude='.env.example' \
            --exclude='html/img/' \
            --exclude='html/imgMid/' \
            --exclude='html/thumbnails/' \
            --exclude='html/baseImages/' \
            --exclude='html/sslStuff/' \
            --exclude='*.key' \
            --exclude='*.pem' \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH"
